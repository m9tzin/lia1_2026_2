[project]
name = "triagem-composicao-lote"
version = "1.0.0"
description = "Classificacao e estimativa direta da composicao de lotes reciclaveis"
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.19,<3",
    "numpy>=2.0",
    "matplotlib>=3.10.0",
    "pillow>=11.0",
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
